<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Leontief Model</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
    text-align: center;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
}

th:first-child, td:first-child {
    text-align: left;
}

th {
    background: #f2f2f2;
	text-align: center;
}

input {
    width: 80px;
    text-align: right;
}

button {
    background: #0078ff;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}

button:hover {
    background: #005fcc;
    transform: translateY(-2px);
}

.back-button {
    background: #555;
    margin-left: 10px;
}

.back-button:hover {
    background: #333;
}

.top-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.linea-tabella {
    width: 100%;
    height: 2px;
    background: #0078ff;
    margin: 15px 0;
}

#grafico-container {
    height: 800px;
    margin-top: 30px;
}

.header{
    position: sticky;
    top: 0;
    background: white;
    z-index: 999;
    padding-bottom: 10px;
}

.moltiplicatore-wrapper{
    display:flex;
    justify-content:center;
    margin-top:25px;
}

.moltiplicatore-table {
    width: auto;
    border-collapse: separate;
    border-spacing: 0;
    background: linear-gradient(135deg, #f7faff, #eef4ff);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font-size: 16px;
    min-width: 320px;
}

.moltiplicatore-table td {
    padding: 14px 18px;
    border: none;
}

.moltiplicatore-table td:first-child {
    font-weight: 700;
    color: #222;
    text-align: left;
}

.moltiplicatore-table td:last-child {
    font-weight: 800;
    font-size: 18px;
    color: #0078ff;
    text-align: right;
}
</style>
</head>

<body>

<div class="header">

<h2 style="text-align:center">
Modello di Leontief su tavola Input-Output Branca x Branca - Italia 2022 (Valori in milioni di euro)
</h2>

<div class="linea-tabella"></div>

<p id="status">Caricamento…</p>

<div class="top-buttons">
    <button onclick="calcola()">CALCOLA</button>
    <button class="back-button" onclick="window.location.href='index.html'">BACK</button>
</div>

</div>

<table id="tabella">
<thead>
<tr>
    <th>Branca</th>
    <th>Policy</th>
    <th>Produzione pre</th>
    <th>Produzione post</th>
    <th>Var % sul benchmark</th>
    <th>Peso %</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="moltiplicatore-wrapper">
<table class="moltiplicatore-table">
<tr>
    <td>Moltiplicatore della produzione</td>
    <td id="moltiplicatore"></td>
</tr>
</table>
</div>

<div id="grafico-container">
<canvas id="grafico"></canvas>
</div>

<div id="grafico-container">
<canvas id="graficoPesi"></canvas>
</div>

<script>

let M = null;
let domandaFinale = [];
let produzione = [];
let chart = null;
let chartPesi = null;
let pesi = [];

function formatInt(n){
    return new Intl.NumberFormat("it-IT",{
        useGrouping:true,
        minimumFractionDigits:1,
        maximumFractionDigits:1
    }).format(Number(n));
}

function formatPerc(n){
    return (Math.abs(n)<0.05?0:n).toFixed(2) + "%";
}

const settori = [
    "Produzioni vegetali e animali, caccia e servizi connessi",
    "Silvicoltura e utilizzo di aree forestali",
    "Pesca e acquicoltura",
    "Attività estrattiva",
    "Industrie alimentari, delle bevande e del tabacco",
    "Industrie tessili, confezione di articoli di abbigliamento e di articoli in pelle e simili",
    "Industria del legno e dei prodotti in legno e sughero, esclusi i mobili; fabbricazione di articoli in paglia e materiali da intreccio",
    "Fabbricazione di carta e di prodotti di carta",
    "Stampa e riproduzione su supporti registrati",
    "Fabbricazione di coke e prodotti derivanti dalla raffinazione del petrolio",
    "Fabbricazione di prodotti chimici",
    "Fabbricazione di prodotti farmaceutici di base e di preparati farmaceutici",
    "Fabbricazione di articoli in gomma e materie plastiche",
    "Fabbricazione di altri prodotti della lavorazione di minerali non metalliferi",
    "Attività metallurgiche",
    "Fabbricazione di prodotti in metallo, esclusi macchinari e attrezzature",
    "Fabbricazione di computer e prodotti di elettronica e ottica",
    "Fabbricazione di apparecchiature elettriche",
    "Fabbricazione di macchinari e apparecchiature n.c.a.",
    "Fabbricazione di autoveicoli, rimorchi e semirimorchi",
    "Fabbricazione di altri mezzi di trasporto",
    "Fabbricazione di mobili; altre industrie manifatturiere",
    "Riparazione e installazione di macchine e apparecchiature",
    "Fornitura di energia elettrica, gas, vapore e aria condizionata",
    "Raccolta, trattamento e fornitura di acqua",
    "Gestione delle reti fognarie; attività di raccolta, trattamento e smaltimento dei rifiuti; recupero dei materiali; attività di risanamento e altri servizi di gestione dei rifiuti",
    "Costruzioni",
    "Commercio all’ingrosso e al dettaglio e riparazione di autoveicoli e motocicli",
    "Commercio all’ingrosso, escluso quello di autoveicoli e di motocicli",
    "Commercio al dettaglio, escluso quello di autoveicoli e di motocicli",
    "Trasporto terrestre e trasporto mediante condotte",
    "Trasporti marittimi e per vie d’acqua",
    "Trasporto aereo",
    "Magazzinaggio e attività di supporto ai trasporti",
    "Servizi postali e attività di corriere",
    "Servizi di alloggio; attività di servizi di ristorazione",
    "Attività editoriali",
    "Attività di produzione cinematografica, di video e di programmi televisivi, di registrazioni musicali e sonore; attività di programmazione e trasmissione",
    "Telecomunicazioni",
    "Programmazione, consulenza informatica e attività connesse; attività dei servizi d’informazione",
    "Prestazione di servizi finanziari (ad esclusione di assicurazioni e fondi pensione)",
    "Assicurazioni, riassicurazioni e fondi pensione, escluse le assicurazioni sociali obbligatorie",
    "Attività ausiliarie dei servizi finanziari e delle attività assicurative",
    "Attività immobiliari",
    "Attività legali e contabilità; attività di sedi centrali; consulenza gestionale",
    "Attività degli studi di architettura e d’ingegneria; collaudi e analisi tecniche",
    "Ricerca scientifica e sviluppo",
    "Pubblicità e ricerche di mercato",
    "Altre attività professionali, scientifiche e tecniche; servizi veterinari",
    "Attività di noleggio e leasing",
    "Attività di ricerca, selezione, fornitura di personale",
    "Attività dei servizi delle agenzie di viaggio, dei tour operator e servizi di prenotazione e attività correlate",
    "Servizi di investigazione e vigilanza; attività di servizi per edifici e per paesaggio; attività amministrative e di supporto per le funzioni d’ufficio e altri servizi di supporto alle imprese",
    "Amministrazione pubblica e difesa; assicurazione sociale obbligatoria",
    "Istruzione",
    "Attività dei servizi sanitari",
    "Assistenza sociale",
    "Attività creative, artistiche e d’intrattenimento; attività di biblioteche, archivi, musei e altre attività culturali; attività riguardanti scommesse e case da gioco",
    "Attività sportive, di intrattenimento e di divertimento",
    "Attività di organizzazioni associative",
    "Riparazione di computer e di beni per uso personale e per la casa",
    "Altre attività di servizi personali",
    "Attività di famiglie e convivenze come datori di lavoro per personale domestico; produzione di beni e di servizi indifferenziati per uso proprio da parte di famiglie e convivenze"
];

function creaTabella(){

    const tbody=document.querySelector("tbody");
    tbody.innerHTML="";

    for(let i=0;i<63;i++){
        tbody.innerHTML+=`
        <tr>
            <td>${settori[i]}</td>
            <td><input id="p${i}" value="0"></td>
            <td>${formatInt(produzione[i])}</td>
            <td id="r${i}"></td>
            <td id="v${i}"></td>
            <td id="w${i}"></td>
        </tr>`;
    }

    tbody.innerHTML+=`
    <tr style="font-weight:bold;background:#eef">
        <td>Totale</td>
        <td id="t3policy"></td>
        <td id="t4"></td>
        <td id="t5"></td>
        <td id="t6"></td>
        <td id="t7"></td>
    </tr>`;
}

function somma(a){
    return a.reduce((x,y)=>x+(Number(y)||0),0);
}

function aggiornaGrafico(v){

    const ctx=document.getElementById("grafico").getContext("2d");

    if(chart) chart.destroy();

    chart=new Chart(ctx,{
        type:"bar",
        data:{
            labels:settori,
            datasets:[{
                label:"Variazione percentuale rispetto al benchmark",
                data:v,
                backgroundColor:v.map(x=>
                    x>=0?"rgba(0,120,255,0.6)":"rgba(255,80,80,0.6)"
                )
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

function aggiornaGraficoPesi(v){

    const ctx=document.getElementById("graficoPesi").getContext("2d");

    if(chartPesi) chartPesi.destroy();

    chartPesi=new Chart(ctx,{
        type:"bar",
        data:{
            labels:settori,
            datasets:[{
                label:"Contributo percentuale alla variazione della produzione",
                data:v,
                backgroundColor:"rgba(0,180,0,0.6)"
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

function calcola(){

    if(!M) return;

    const nuova=[];
    let sommaPolicy=0;
    pesi=[];

    for(let i=0;i<63;i++){
        const pol=Number(document.getElementById("p"+i).value)||0;
        sommaPolicy+=pol;
        nuova.push(domandaFinale[i]+pol);
    }

    const showGraphs = sommaPolicy !== 0;

    document.querySelectorAll("#grafico-container").forEach(el=>{
        el.style.display = showGraphs ? "" : "none";
    });

    if(!showGraphs){
        if(chart){ chart.destroy(); chart=null; }
        if(chartPesi){ chartPesi.destroy(); chartPesi=null; }
    }

    const risultato=[];
    const variazioni=[];
    let sommaDiff=0;

    for(let i=0;i<63;i++){

        let s=0;
        for(let j=0;j<63;j++) s+=M[i][j]*nuova[j];

        risultato[i]=s;
        document.getElementById("r"+i).innerText=formatInt(s);

        let v=((s-produzione[i])/produzione[i])*100;
        variazioni[i]=v;
        document.getElementById("v"+i).innerText =
            (sommaPolicy===0 ? "0.00%" : formatPerc(v));

        let diff=s-produzione[i];
        sommaDiff+=diff;
    }

    let sommaPesi=0;

    for(let i=0;i<63;i++){

        let w = sommaDiff!==0 ? ((risultato[i]-produzione[i])/sommaDiff)*100 : 0;

        pesi[i]=w;
        sommaPesi+=w;

        document.getElementById("w"+i).innerText =
            (sommaPolicy===0 ? "0.00%" : w.toFixed(2)+"%");
    }

    document.getElementById("t7").innerText =
        (sommaPolicy===0 ? "0.00%" : sommaPesi.toFixed(2)+"%");

    const t5=somma(risultato);
    const base=somma(produzione);
    const t6=((t5-base)/base)*100;

    document.getElementById("t3policy").innerText=sommaPolicy;
    document.getElementById("t4").innerText=formatInt(base);
    document.getElementById("t5").innerText=formatInt(t5);
    document.getElementById("t6").innerText =
        (sommaPolicy===0 ? "0.00%" : formatPerc(t6));

    document.getElementById("moltiplicatore").innerText=
        ((t5-base)/sommaPolicy||0).toFixed(2);

    if(showGraphs){
        aggiornaGrafico(variazioni);
        aggiornaGraficoPesi(pesi);
    }
}

window.onload=async function(){

    const f=await fetch("ita_bxb_2022.xlsx");
    const b=await f.arrayBuffer();
    const wb=XLSX.read(b,{type:"array"});

    M=XLSX.utils.sheet_to_json(wb.Sheets["inversa"],{header:1})
        .map(r=>r.map(v=>Number(v)||0));

    domandaFinale=XLSX.utils.sheet_to_json(wb.Sheets["domanda"],{header:1})
        .map(r=>Number(r[0])||0);

    produzione=XLSX.utils.sheet_to_json(wb.Sheets["produzione"],{header:1})
        .map(r=>Number(r[0])||0);

    creaTabella();
    document.getElementById("status").innerText="Dati caricati ✔";
};

</script>

</body>
</html>
