<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modelli Input-Output Italia</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, sans-serif;
        min-height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;

        background:
            linear-gradient(135deg,#0f172a 0%, #1e3a8a 45%, #2563eb 100%);

        overflow:hidden;
    }

    /* sfondo decorativo */
    body::before{
        content:"";
        position:absolute;
        width:700px;
        height:700px;
        border-radius:50%;
        background:rgba(255,255,255,0.05);
        top:-250px;
        right:-200px;
        filter: blur(10px);
    }

    body::after{
        content:"";
        position:absolute;
        width:500px;
        height:500px;
        border-radius:50%;
        background:rgba(255,255,255,0.04);
        bottom:-180px;
        left:-120px;
        filter: blur(8px);
    }

    .container{

        position:relative;
        z-index:2;

        width:90%;
        max-width:700px;

        background:rgba(255,255,255,0.10);

        backdrop-filter: blur(12px);

        border:1px solid rgba(255,255,255,0.15);

        border-radius:28px;

        padding:60px 50px;

        text-align:center;

        box-shadow:
            0 15px 40px rgba(0,0,0,0.30);
    }

    h1{
        color:white;
        font-size:38px;
        margin-bottom:18px;
        font-weight:700;
        letter-spacing:0.5px;
    }

    .subtitle{
        color:rgba(255,255,255,0.85);
        font-size:18px;
        line-height:1.6;
        margin-bottom:55px;
    }

    .buttons{
        display:flex;
        gap:30px;
        justify-content:center;
        flex-wrap:wrap;
    }

    .btn{

        text-decoration:none;

        min-width:260px;

        padding:22px 28px;

        border-radius:18px;

        font-size:22px;
        font-weight:700;

        transition:all 0.25s ease;

        position:relative;

        overflow:hidden;
    }

    .btn::before{

        content:"";

        position:absolute;

        top:0;
        left:-100%;

        width:100%;
        height:100%;

        background:rgba(255,255,255,0.15);

        transition:left 0.4s ease;
    }

    .btn:hover::before{
        left:100%;
    }

    .btn-pxp,
.btn-bxb{

    background:white;
    color:#0f172a;

    box-shadow:
        0 10px 25px rgba(255,255,255,0.20);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
}

.btn-pxp:hover{

    transform:translateY(-4px) scale(1.02);

    background:#2563eb;
    color:white;

    box-shadow:
        0 18px 35px rgba(37,99,235,0.40);
}

.btn-bxb:hover{

    transform:translateY(-4px) scale(1.02);

    background:#0f172a;
    color:white;

    box-shadow:
        0 18px 35px rgba(15,23,42,0.45);
}

    .footer{
        margin-top:45px;
        color:rgba(255,255,255,0.65);
        font-size:14px;
        letter-spacing:0.3px;
    }

    @media(max-width:700px){

        h1{
            font-size:32px;
        }

        .subtitle{
            font-size:16px;
        }

        .btn{
            width:100%;
            min-width:auto;
        }

        .container{
            padding:45px 28px;
        }
    }
	
.footer-link{
    color:white;
    text-decoration:none;
    font-weight:600;
    transition:all 0.2s ease;
}

.footer-link:hover{
    color:#93c5fd;
    text-shadow:0 0 8px rgba(147,197,253,0.7);
}

</style>
</head>

<body>

<div class="container">

    <h1>
        Modelli Input-Output Italia 2022
    </h1>

    <div class="subtitle">
        Seleziona il modello economico da analizzare
    </div>

    <div class="buttons">

        <a class="btn btn-pxp" href="ita_pxp.html">
            Prodotto × Prodotto
        </a>

        <a class="btn btn-bxb" href="">
            Branca × Branca
        </a>

    </div>

    <div class="footer">
    <br><br>

    Realizzato da

    <a
        href="https://docenti.unimc.it/s.deriu"
        target="_blank"
        class="footer-link"
    >
        Stefano Deriu
    </a>
</div>

</div>

</body>
</html>
