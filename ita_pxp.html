<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Leontief Model</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
    text-align: center;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
}

th:first-child, td:first-child {
    text-align: left;
}

th {
    background: #f2f2f2;
}

input {
    width: 80px;
    text-align: right;
}

button {
    background: #0078ff;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}

button:hover {
    background: #005fcc;
    transform: translateY(-2px);
}

.back-button {
    background: #555;
    margin-left: 10px;
}

.back-button:hover {
    background: #333;
}

.top-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.linea-tabella {
    width: 100%;
    height: 2px;
    background: #0078ff;
    margin: 15px 0;
}

#grafico-container {
    height: 800px;
    margin-top: 30px;
}

/* ========================= */
/* HEADER STICKY (AGGIUNTO)  */
/* ========================= */

.header{
    position: sticky;
    top: 0;
    background: white;
    z-index: 999;
    padding-bottom: 10px;
}

/* ========================= */
/* MOLTIPLICATORE STYLING   */
/* ========================= */

.moltiplicatore-wrapper{
    display:flex;
    justify-content:center;
    margin-top:25px;
}

.moltiplicatore-table {
    width: auto;
    border-collapse: separate;
    border-spacing: 0;
    background: linear-gradient(135deg, #f7faff, #eef4ff);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font-size: 16px;
    min-width: 320px;
}

.moltiplicatore-table td {
    padding: 14px 18px;
    border: none;
}

.moltiplicatore-table td:first-child {
    font-weight: 700;
    color: #222;
    text-align: left;
}

.moltiplicatore-table td:last-child {
    font-weight: 800;
    font-size: 18px;
    color: #0078ff;
    text-align: right;
}

</style>
</head>

<body>

<!-- HEADER FISSO -->
<div class="header">

<h2 style="text-align:center">
Modello di Leontief su tavola Input-Outptut prodotto x prodotto - Italia 2022
</h2>

<div class="linea-tabella"></div>

<p id="status">Caricamento…</p>

<div class="top-buttons">
    <button onclick="calcola()">CALCOLA</button>
    <button class="back-button" onclick="window.location.href='index.html'">BACK</button>
</div>

</div>

<table id="tabella">
<thead>
<tr>
    <th>Prodotto</th>
    <th>Domanda finale</th>
    <th>Policy</th>
    <th>Nuova domanda finale</th>
    <th>Produzione pre</th>
    <th>Produzione post</th>
    <th>Variazione %</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="moltiplicatore-wrapper">
<table class="moltiplicatore-table">
<tr>
    <td>Moltiplicatore della produzione</td>
    <td id="moltiplicatore"></td>
</tr>
</table>
</div>

<div id="grafico-container">
<canvas id="grafico"></canvas>
</div>

<script>

let M = null;
let domandaFinale = [];
let produzione = [];
let chart = null;

function formatInt(n){
    return Number(n).toLocaleString("it-IT", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
    });
}

function formatPerc(n){
    return (Math.abs(n)<0.05?0:n).toFixed(2) + "%";
}

const settori = [
"Prodotti dell’agricoltura e della caccia e relativi servizi",
"Prodotti della silvicoltura",
"Pesca e acquacoltura",
"Estrazione di minerali",
"Prodotti alimentari, bevande e tabacco",
"Prodotti tessili e abbigliamento",
"Legno e prodotti in legno",
"Carta e prodotti di carta",
"Stampa e servizi connessi",
"Coke e prodotti petroliferi",
"Prodotti chimici",
"Prodotti farmaceutici",
"Articoli in gomma e plastica",
"Minerali non metalliferi",
"Metalli",
"Prodotti in metallo",
"Computer e prodotti elettronici",
"Apparecchiature elettriche",
"Macchinari",
"Autoveicoli",
"Altri mezzi di trasporto",
"Mobilio",
"Riparazioni e installazioni",
"Energia elettrica e gas",
"Acqua e rifiuti",
"Trattamento acque reflue",
"Costruzioni",
"Commercio e riparazioni",
"Commercio all’ingrosso",
"Commercio al dettaglio",
"Trasporto terrestre",
"Trasporto marittimo",
"Trasporto aereo",
"Magazzinaggio",
"Servizi postali",
"Alloggio e ristorazione",
"Editoria",
"Produzione cinematografica",
"Telecomunicazioni",
"Informatica",
"Servizi finanziari",
"Assicurazioni",
"Servizi ausiliari finanziari",
"Immobiliare",
"Servizi legali e contabilità",
"Architettura e ingegneria",
"Ricerca e sviluppo",
"Pubblicità e marketing",
"Servizi professionali",
"Locazione e leasing",
"Servizi del lavoro",
"Agenzie di viaggio",
"Servizi di vigilanza e pulizia",
"Pubblica amministrazione",
"Istruzione",
"Sanità",
"Assistenza sociale",
"Servizi culturali",
"Sport e intrattenimento",
"Organizzazioni associative",
"Riparazione beni personali",
"Altri servizi personali",
"Servizi delle famiglie"
];

function creaTabella(){

    const tbody=document.querySelector("tbody");
    tbody.innerHTML="";

    for(let i=0;i<63;i++){

        tbody.innerHTML+=`
        <tr>
            <td>${settori[i]}</td>
            <td>${formatInt(domandaFinale[i])}</td>
            <td><input id="p${i}" value="0"></td>
            <td id="n${i}"></td>
            <td>${formatInt(produzione[i])}</td>
            <td id="r${i}"></td>
            <td id="v${i}"></td>
        </tr>`;
    }

    tbody.innerHTML+=`
    <tr style="font-weight:bold;background:#eef">
        <td>Totale</td>
        <td id="t2"></td>
        <td id="t3policy"></td>
        <td id="t3"></td>
        <td id="t4"></td>
        <td id="t5"></td>
        <td id="t6"></td>
    </tr>`;
}

function somma(a){
    return a.reduce((x,y)=>x+(Number(y)||0),0);
}

function inizializzaTotali(){

    document.getElementById("t2").innerText =
        formatInt(somma(domandaFinale));

    document.getElementById("t4").innerText =
        formatInt(somma(produzione));
}

function aggiornaGrafico(v){

    const ctx=document.getElementById("grafico").getContext("2d");

    if(chart) chart.destroy();

    chart=new Chart(ctx,{
        type:"bar",
        data:{
            labels:settori,
            datasets:[{
                label:"Variazione %",
                data:v,
                backgroundColor:v.map(x=>
                    x>=0?"rgba(0,120,255,0.6)":"rgba(255,80,80,0.6)"
                )
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

function calcola(){

    if(!M) return;

    const nuova=[];
    let sommaPolicy = 0;

    for(let i=0;i<63;i++){

        const pol=Number(document.getElementById("p"+i).value)||0;
        sommaPolicy += pol;

        const val=domandaFinale[i]+pol;

        nuova.push(val);
        document.getElementById("n"+i).innerText=formatInt(val);
    }

    const risultato=[];
    const variazioni=[];

    for(let i=0;i<63;i++){

        let s=0;
        for(let j=0;j<63;j++) s+=M[i][j]*nuova[j];

        risultato[i]=s;
        document.getElementById("r"+i).innerText=formatInt(s);

        let v=((s-produzione[i])/produzione[i])*100;
        v=Math.round(v*100)/100;

        variazioni[i]=v;
        document.getElementById("v"+i).innerText=formatPerc(v);
    }

    const t5=somma(risultato);
    const base=somma(produzione);
    const t6=((t5-base)/base)*100;

    const t3 = somma(nuova);

    document.getElementById("t3policy").innerText = formatInt(sommaPolicy);
    document.getElementById("t3").innerText = formatInt(t3);
    document.getElementById("t5").innerText = formatInt(t5);
    document.getElementById("t6").innerText = formatPerc(t6);

    const moltiplicatore = sommaPolicy !== 0 ? (t5 - base) / sommaPolicy : 0;

    document.getElementById("moltiplicatore").innerText =
        moltiplicatore.toFixed(2);

    aggiornaGrafico(variazioni);
}

window.onload=async function(){

    const f=await fetch("ita_pxp_2022.xlsx");
    const b=await f.arrayBuffer();
    const wb=XLSX.read(b,{type:"array"});

    M=XLSX.utils.sheet_to_json(wb.Sheets["inversa"],{header:1})
        .map(r=>r.map(v=>Number(v)||0));

    domandaFinale=XLSX.utils.sheet_to_json(wb.Sheets["domanda"],{header:1})
        .map(r=>Number(r[0])||0);

    produzione=XLSX.utils.sheet_to_json(wb.Sheets["produzione"],{header:1})
        .map(r=>Number(r[0])||0);

    creaTabella();
    inizializzaTotali();

    document.getElementById("status").innerText="Dati caricati ✔";
};

</script>

</body>
</html>
