<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tabella 63×6 con moltiplicazione matrice</title>

<style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 4px; text-align: right; }
    th:first-child, td:first-child { text-align: left; font-weight: bold; }
    th { background: #eee; }
    input { width: 80px; text-align: right; }
</style>
</head>

<body>

<h2>Calcolo economico 63×6</h2>
<p id="status">Caricamento matrice in corso…</p>

<!-- 🔵 PULSANTE SOPRA LA TABELLA -->
<button onclick="calcola()">Calcola</button>

<table id="tabella">
    <thead>
        <tr>
            <th>Settore</th>
            <th>Domanda finale</th>
            <th>Policy</th>
            <th>Nuova domanda finale</th>
            <th>Produzione</th>
            <th>Risultato (M × col.3)</th>
            <th>Variazione %</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let M = null; // matrice 63×63

// -----------------------------
// INTESTAZIONI DI RIGA (63 settori)
// -----------------------------
const settori = [
"Servizi di trasporto terrestre e di trasporto mediante condotte",
"Servizi di trasporto marittimo e per vie d’acqua",
"Servizi di trasporto aereo",
"Servizi di magazzinaggio e di supporto per i trasporti",
"Servizi postali e di corriere",
"Servizi di alloggio e di ristorazione",
"Servizi di editoria",
"Servizi di produzione cinematografica, video, TV, registrazioni sonore e musicali; programmazione ed emissione radiotelevisiva",
"Servizi di telecomunicazione",
"Programmazione informatica, consulenze e servizi connessi; servizi d’informazione",
"Servizi finanziari (escluse assicurazioni e fondi pensione)",
"Servizi connessi alle assicurazioni e ai fondi pensione",
"Servizi ausiliari finanziari e assicurativi",
"Servizi immobiliari",
"Servizi legali, contabilità, sedi sociali, consulenza gestionale",
"Servizi di architettura e ingegneria; sperimentazione e analisi tecnica",
"Servizi di ricerca e sviluppo scientifici",
"Servizi di pubblicità e studi di mercato",
"Altri servizi professionali, scientifici e tecnici; servizi veterinari",
"Servizi di locazione e leasing",
"Servizi del lavoro",
"Agenzie di viaggio, tour operator, prenotazioni e servizi connessi",
"Servizi investigativi, vigilanza, manutenzione edifici, paesaggio, amministrativi e di supporto",
"Pubblica amministrazione e difesa; assicurazione sociale obbligatoria",
"Istruzione",
"Servizi sanitari",
"Assistenza residenziale e non residenziale",
"Servizi creativi, artistici, intrattenimento, biblioteche, musei, gioco d’azzardo",
"Servizi sportivi, intrattenimento e divertimento",
"Servizi forniti da organizzazioni associative",
"Riparazione di computer e beni per uso personale e domestico",
"Altri servizi personali",
"Servizi delle famiglie come datori di lavoro; produzione per uso proprio",
"Servizi di trasporto terrestre e condotte (duplicato per coerenza con 63 settori)",
"Servizi di trasporto marittimo (duplicato)",
"Servizi di trasporto aereo (duplicato)",
"Servizi di magazzinaggio (duplicato)",
"Servizi postali (duplicato)",
"Servizi di alloggio (duplicato)",
"Servizi di editoria (duplicato)",
"Servizi cinematografici e TV (duplicato)",
"Servizi di telecomunicazione (duplicato)",
"Servizi informatici (duplicato)",
"Servizi finanziari (duplicato)",
"Servizi assicurativi (duplicato)",
"Servizi ausiliari finanziari (duplicato)",
"Servizi immobiliari (duplicato)",
"Servizi legali e contabili (duplicato)",
"Servizi di architettura e ingegneria (duplicato)",
"Servizi R&S (duplicato)",
"Servizi pubblicitari (duplicato)",
"Servizi professionali vari (duplicato)",
"Servizi di leasing (duplicato)",
"Servizi del lavoro (duplicato)",
"Agenzie di viaggio (duplicato)",
"Servizi investigativi (duplicato)",
"Pubblica amministrazione (duplicato)",
"Istruzione (duplicato)",
"Sanità (duplicato)",
"Assistenza sociale (duplicato)",
"Servizi culturali (duplicato)",
"Servizi sportivi (duplicato)",
"Organizzazioni associative (duplicato)",
"Riparazioni (duplicato)",
"Altri servizi personali (duplicato)"
];

// -----------------------------
// COLONNA 1 — Domanda finale
// -----------------------------
const domandaFinale = [
9370, 3168, 797, -85328, 92937, 53170, -1515, 4186, 652, 39113,
-5240, 3312, 13071, 9375, -11551, 27095, 6241, 14485, 90360, 33463,
23592, 38645, 17191, 16575, 5762, 7715, 198872, 31384, 93831, 138164,
25994, 7333, 1528, 19723, 695, 101540, 7437, 6125, 8958, 28318,
11940, 26432, 1557, 208429, 8420, 1041, 38514, -1686, 1781, -487,
491, 4376, 8811, 131275, 81916, 146937, 14917, 17575, 7191, 3629,
2249, 25719, 16180
];

// -----------------------------
// COLONNA 4 — Produzione
// -----------------------------
const produzione = [
66367.0084, 3865.69353, 1473.46688, 8561.82371, 184307.919, 97610.30622,
15262.08876, 35441.83757, 11008.12602, 84850.34233, 73553.80921, 25077.23553,
62791.32198, 42905.44759, 92959.02369, 134338.7907, 29059.60696, 48392.52207,
140054.3638, 60201.89664, 31332.71388, 63248.34621, 34091.2615, 136945.5505,
8859.49552, 59881.32821, 297226.0068, 45027.26939, 197527.2561, 154109.9339,
106534.481, 10987.91341, 3597.71993, 102567.3914, 5787.42329, 143570.351,
12246.61791, 13998.74919, 34816.18952, 82293.02111, 71725.50641, 38488.09541,
37869.32766, 270792.5128, 113460.6417, 49609.40238, 44640.69166, 24268.61153,
31116.56859, 47626.96032, 17130.34028, 12659.65704, 74378.7704, 136330,
93490.50073, 162481.6188, 24842.03358, 34595.00605, 19049.25312, 6037.86772,
4849.85438, 29735.7679, 16180.39077
];

// -----------------------------
// CREA LA TABELLA
// -----------------------------
const tbody = document.querySelector("#tabella tbody");

for (let i = 0; i < 63; i++) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td>${settori[i]}</td>
        <td>${domandaFinale[i].toFixed(3)}</td>
        <td><input id="policy${i}" type="number" step="0.0001" value="0"></td>
        <td id="nuova${i}"></td>
        <td>${produzione[i].toFixed(3)}</td>
        <td id="ris${i}"></td>
        <td id="var${i}"></td>
    `;

    tbody.appendChild(tr);
}

// -----------------------------
// CARICA AUTOMATICAMENTE LA MATRICE
// -----------------------------
window.addEventListener("DOMContentLoaded", function() {

    fetch("ita_2022.txt")
        .then(r => r.text())
        .then(text => {
            const righe = text.trim().split(/\r?\n/);
            M = righe.map(r => r.split(/\s+|\t+/).map(Number));
            document.getElementById("status").textContent =
                "Matrice 63×63 caricata automaticamente ✔";
        })
        .catch(err => alert("Errore nel caricamento della matrice"));
});

// -----------------------------
// CALCOLO COMPLETO
// -----------------------------
function calcola() {
    if (!M) {
        alert("La matrice non è stata caricata.");
        return;
    }

    // Colonna 3 — nuova domanda finale
    const nuova = [];
    for (let i = 0; i < 63; i++) {
        const pol = parseFloat(document.getElementById("policy"+i).value);
        const val = domandaFinale[i] + pol;
        nuova.push(val);
        document.getElementById("nuova"+i).textContent = val.toFixed(3);
    }

    // Colonna 5 — M × nuova
    const risultato = new Array(63).fill(0);
    for (let i = 0; i < 63; i++) {
        let somma = 0;
        for (let j = 0; j < 63; j++) {
            somma += M[i][j] * nuova[j];
        }
        risultato[i] = somma;
        document.getElementById("ris"+i).textContent = somma.toFixed(3);
    }

    // Colonna 6 — variazione %
    for (let i = 0; i < 63; i++) {
        const base = produzione[i];
        const nuovo = risultato[i];
        const perc = ((nuovo - base) / base) * 100;
        document.getElementById("var"+i).textContent = perc.toFixed(2) + "%";
    }
}
</script>

</body>
</html>
