<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Leontief Model</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
    text-align: center;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
}

th:first-child, td:first-child {
    text-align: left;
}

th {
    background: #f2f2f2;
	text-align: center;
}

input {
    width: 80px;
    text-align: right;
}

button {
    background: #0078ff;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}

button:hover {
    background: #005fcc;
    transform: translateY(-2px);
}

.back-button {
    background: #555;
    margin-left: 10px;
}

.back-button:hover {
    background: #333;
}

.top-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.linea-tabella {
    width: 100%;
    height: 2px;
    background: #0078ff;
    margin: 15px 0;
}

#grafico-container {
    height: 800px;
    margin-top: 30px;
}

.header{
    position: sticky;
    top: 0;
    background: white;
    z-index: 999;
    padding-bottom: 10px;
}

.moltiplicatore-wrapper{
    display:flex;
    justify-content:center;
    margin-top:25px;
}

.moltiplicatore-table {
    width: auto;
    border-collapse: separate;
    border-spacing: 0;
    background: linear-gradient(135deg, #f7faff, #eef4ff);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font-size: 16px;
    min-width: 320px;
}

.moltiplicatore-table td {
    padding: 14px 18px;
    border: none;
}

.moltiplicatore-table td:first-child {
    font-weight: 700;
    color: #222;
    text-align: left;
}

.moltiplicatore-table td:last-child {
    font-weight: 800;
    font-size: 18px;
    color: #0078ff;
    text-align: right;
}
</style>
</head>

<body>

<div class="header">

<h2 style="text-align:center">
Modello di Leontief su tavola Input-Output Prodotto x Prodotto - Italia 2022  (Valori in milioni di euro)
</h2>

<div class="linea-tabella"></div>

<p id="status">Caricamento…</p>

<div class="top-buttons">
    <button onclick="calcola()">CALCOLA</button>
    <button class="back-button" onclick="window.location.href='index.html'">BACK</button>
</div>

</div>

<table id="tabella">
<thead>
<tr>
    <th>Prodotto</th>
    <th>Policy</th>
    <th>Produzione pre</th>
    <th>Produzione post</th>
    <th>Var % sul benchmark</th>
    <th>Peso %</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="moltiplicatore-wrapper">
<table class="moltiplicatore-table">
<tr>
    <td>Moltiplicatore della produzione</td>
    <td id="moltiplicatore"></td>
</tr>
</table>
</div>

<div id="grafico-container">
<canvas id="grafico"></canvas>
</div>

<div id="grafico-container">
<canvas id="graficoPesi"></canvas>
</div>

<script>

let M = null;
let domandaFinale = [];
let produzione = [];
let chart = null;
let chartPesi = null;
let pesi = [];

function formatInt(n){
    return new Intl.NumberFormat("it-IT",{
        useGrouping:true,
        minimumFractionDigits:1,
        maximumFractionDigits:1
    }).format(Number(n));
}

function formatPerc(n){
    return (Math.abs(n)<0.05?0:n).toFixed(2) + "%";
}

const settori = [
"Prodotti dell’agricoltura e della caccia e relativi servizi",
"Prodotti della silvicoltura, delle operazioni di taglio e trasporto dei tronchi e servizi connessi",
"Pesci ed altri prodotti della pesca; prodotti dell’acquacoltura; servizi di supporto per la pesca",
"Prodotti delle miniere e delle cave",
"Prodotti alimentari, bevande e prodotti a base di tabacco",
"Prodotti tessili; articoli di abbigliamento; cuoio e relativi prodotti",
"Legno e prodotti in legno e sughero (esclusi i mobili); articoli di paglia e materiali da intreccio",
"Carta e prodotti di carta",
"Servizi di stampa e di registrazione",
"Coke e prodotti petroliferi raffinati",
"Prodotti chimici",
"Prodotti farmaceutici di base e preparati farmaceutici",
"Articoli in gomma e in materie plastiche",
"Altri prodotti della lavorazione di minerali non metalliferi",
"Metalli",
"Prodotti in metallo, esclusi macchine e impianti",
"Prodotti informatici, elettronici ed ottici",
"Apparecchiature elettriche",
"Macchine ed apparecchi meccanici n.c.a.",
"Autoveicoli, rimorchi e semirimorchi",
"Altri mezzi di trasporto",
"Mobilio; altri manufatti",
"Servizi di riparazione e installazione di macchinari e apparecchi",
"Energia elettrica, gas, vapore e aria condizionata",
"Acqua naturale; servizi di trattamento delle acque e di produzione e distribuzione d’acqua",
"Servizi di smaltimento delle acque di scarico; fanghi di depurazione; servizi di raccolta, trattamento e smaltimento dei rifiuti; servizi di recupero dei materiali; servizi di decontaminazione ed altri servizi di trattamento dei rifiuti",
"Lavori di costruzione ed opere di edilizia civile",
"Servizi di vendita all’ingrosso e al dettaglio e di riparazione di autoveicoli e motocicli",
"Servizi di vendita all’ingrosso, escluso quello di autoveicoli e di motocicli",
"Servizi di vendita al dettaglio, escluso quello di autoveicoli e di motocicli",
"Servizi di trasporto terrestre e di trasporto mediante condotte",
"Servizi di trasporto marittimo e per vie d’acqua",
"Servizi di trasporto aereo",
"Servizi di magazzinaggio e di supporto per i trasporti",
"Servizi postali e di corriere",
"Servizi di alloggio e di ristorazione",
"Servizi di editoria",
"Servizi di produzione di pellicole cinematografiche, di video e di programmi televisivi; edizione di registrazioni sonore e edizioni musicali; servizi di programmazione e di emissione radiofonica e televisiva",
"Servizi di telecomunicazione",
"Programmazione informatica, consulenze e servizi connessi; servizi d’informazione",
"Servizi finanziari (escluse le assicurazioni e i fondi pensione)",
"Servizi connessi alle assicurazioni, alle riassicurazioni e ai fondi pensione, escluse le assicurazioni sociali obbligatorie",
"Servizi ausiliari dei servizi finanziari e dei servizi assicurativi",
"Servizi immobiliari",
"Servizi legali e contabilità; servizi di sedi sociali; servizi di consulenza in materia amministrativo-gestionale",
"Servizi in materia di architettura e di ingegneria; servizi di sperimentazione e di analisi tecnica",
"Servizi di ricerca e sviluppo scientifici",
"Servizi di pubblicità e studi di mercato",
"Altri servizi professionali, scientifici e tecnici; servizi veterinari",
"Servizi di locazione e leasing",
"Servizi del lavoro",
"Servizi delle agenzie di viaggio, degli operatori turistici ed altri servizi di prenotazione e servizi connessi",
"Servizi investigativi e di vigilanza; servizi di manutenzione degli edifici e del paesaggio; servizi amministrativi e di sostegno per le funzioni d’ufficio ed altri servizi di sostegno alle imprese",
"Servizi di pubblica amministrazione e difesa; servizi di assicurazione sociale obbligatoria",
"Servizi di istruzione",
"Servizi sanitari",
"Servizi di assistenza residenziale; servizi di assistenza sociale non residenziale",
"Servizi creativi, artistici e d’intrattenimento; servizi di biblioteche, archivi, musei ed altri servizi culturali; servizi riguardanti il gioco d’azzardo",
"Servizi sportivi e di intrattenimento e divertimento",
"Servizi forniti da organizzazioni associative",
"Servizi di riparazione di elaboratori elettronici e di beni per uso personale e domestico",
"Altri servizi personali",
"Servizi di datore di lavoro svolti da famiglie e convivenze; produzione di beni e servizi per uso proprio da parte di famiglie e convivenze"
];

function creaTabella(){

    const tbody=document.querySelector("tbody");
    tbody.innerHTML="";

    for(let i=0;i<63;i++){
        tbody.innerHTML+=`
        <tr>
            <td>${settori[i]}</td>
            <td><input id="p${i}" value="0"></td>
            <td>${formatInt(produzione[i])}</td>
            <td id="r${i}"></td>
            <td id="v${i}"></td>
            <td id="w${i}"></td>
        </tr>`;
    }

    tbody.innerHTML+=`
    <tr style="font-weight:bold;background:#eef">
        <td>Totale</td>
        <td id="t3policy"></td>
        <td id="t4"></td>
        <td id="t5"></td>
        <td id="t6"></td>
        <td id="t7"></td>
    </tr>`;
}

function somma(a){
    return a.reduce((x,y)=>x+(Number(y)||0),0);
}

function aggiornaGrafico(v){

    const ctx=document.getElementById("grafico").getContext("2d");

    if(chart) chart.destroy();

    chart=new Chart(ctx,{
        type:"bar",
        data:{
            labels:settori,
            datasets:[{
                label:"Variazione percentuale rispetto al benchmark",
                data:v,
                backgroundColor:v.map(x=>
                    x>=0?"rgba(0,120,255,0.6)":"rgba(255,80,80,0.6)"
                )
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

function aggiornaGraficoPesi(v){

    const ctx=document.getElementById("graficoPesi").getContext("2d");

    if(chartPesi) chartPesi.destroy();

    chartPesi=new Chart(ctx,{
        type:"bar",
        data:{
            labels:settori,
            datasets:[{
                label:"Contributo percentuale alla variazione della produzione",
                data:v,
                backgroundColor:"rgba(0,180,0,0.6)"
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

function calcola(){

    if(!M) return;

    const nuova=[];
    let sommaPolicy=0;
    pesi=[];

    for(let i=0;i<63;i++){
        const pol=Number(document.getElementById("p"+i).value)||0;
        sommaPolicy+=pol;
        nuova.push(domandaFinale[i]+pol);
    }

    const showGraphs = sommaPolicy !== 0;

    document.querySelectorAll("#grafico-container").forEach(el=>{
        el.style.display = showGraphs ? "" : "none";
    });

    if(!showGraphs){
        if(chart){ chart.destroy(); chart=null; }
        if(chartPesi){ chartPesi.destroy(); chartPesi=null; }
    }

    const risultato=[];
    const variazioni=[];
    let sommaDiff=0;

    for(let i=0;i<63;i++){

        let s=0;
        for(let j=0;j<63;j++) s+=M[i][j]*nuova[j];

        risultato[i]=s;
        document.getElementById("r"+i).innerText=formatInt(s);

        let v=((s-produzione[i])/produzione[i])*100;
        variazioni[i]=v;
        document.getElementById("v"+i).innerText =
            (sommaPolicy===0 ? "0.00%" : formatPerc(v));

        let diff=s-produzione[i];
        sommaDiff+=diff;
    }

    let sommaPesi=0;

    for(let i=0;i<63;i++){

        let w = sommaDiff!==0 ? ((risultato[i]-produzione[i])/sommaDiff)*100 : 0;

        pesi[i]=w;
        sommaPesi+=w;

        document.getElementById("w"+i).innerText =
            (sommaPolicy===0 ? "0.00%" : w.toFixed(2)+"%");
    }

    document.getElementById("t7").innerText =
        (sommaPolicy===0 ? "0.00%" : sommaPesi.toFixed(2)+"%");

    const t5=somma(risultato);
    const base=somma(produzione);
    const t6=((t5-base)/base)*100;

    document.getElementById("t3policy").innerText=sommaPolicy;
    document.getElementById("t4").innerText=formatInt(base);
    document.getElementById("t5").innerText=formatInt(t5);
    document.getElementById("t6").innerText =
        (sommaPolicy===0 ? "0.00%" : formatPerc(t6));

    document.getElementById("moltiplicatore").innerText=
        ((t5-base)/sommaPolicy||0).toFixed(2);

    if(showGraphs){
        aggiornaGrafico(variazioni);
        aggiornaGraficoPesi(pesi);
    }
}

window.onload=async function(){

    const f=await fetch("ita_pxp_2022.xlsx");
    const b=await f.arrayBuffer();
    const wb=XLSX.read(b,{type:"array"});

    M=XLSX.utils.sheet_to_json(wb.Sheets["inversa"],{header:1})
        .map(r=>r.map(v=>Number(v)||0));

    domandaFinale=XLSX.utils.sheet_to_json(wb.Sheets["domanda"],{header:1})
        .map(r=>Number(r[0])||0);

    produzione=XLSX.utils.sheet_to_json(wb.Sheets["produzione"],{header:1})
        .map(r=>Number(r[0])||0);

    creaTabella();
    document.getElementById("status").innerText="Dati caricati ✔";
};

</script>

</body>
</html>
