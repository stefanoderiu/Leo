<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Prodotto Matrice 2x2 × Vettore 2x1</title>
  <style>
    input { width: 70px; text-align: right; }
    table { border-collapse: collapse; margin-bottom: 10px; }
    td { padding: 4px; }
  </style>
</head>
<body>

  <h2>Matrice inversa 2×2 (fissa)</h2>
  <table border="1">
    <tr>
      <td>1.2</td>
      <td>-0.4</td>
    </tr>
    <tr>
      <td>0.3</td>
      <td>0.9</td>
    </tr>
  </table>

  <h2>Vettore 2×1 (inserisci valori)</h2>
  <table>
    <tr>
      <td><input id="v1" type="number" step="0.01" value="10"></td>
    </tr>
    <tr>
      <td><input id="v2" type="number" step="0.01" value="5"></td>
    </tr>
  </table>

  <button onclick="moltiplica()">Calcola M⁻¹ × v</button>

  <h2>Risultato</h2>
  <p>x₁ = <span id="x1"></span></p>
  <p>x₂ = <span id="x2"></span></p>

  <script>
    function moltiplica() {
      // Matrice inversa fissa
      const m11 = 1.2,  m12 = -0.4;
      const m21 = 0.3,  m22 = 0.9;

      // Vettore inserito dall'utente
      const v1 = parseFloat(document.getElementById('v1').value);
      const v2 = parseFloat(document.getElementById('v2').value);

      // Prodotto matriciale
      const x1 = m11 * v1 + m12 * v2;
      const x2 = m21 * v1 + m22 * v2;

      // Output
      document.getElementById('x1').textContent = x1.toFixed(4);
      document.getElementById('x2').textContent = x2.toFixed(4);
    }
  </script>

</body>
</html>
