// -----------------------------
// FORMATTAZIONE ITALIANA
// -----------------------------
function formatIT(num) {
    return Number(num)
        .toFixed(0)
        .replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// Percentuale con DUE decimali e virgola
function formatPerc(num) {
    let n = Number(num);
    let sign = n < 0 ? "-" : "";
    n = Math.abs(n);

    let intera = Math.floor(n).toString();
    let decimali = (n % 1).toFixed(2).substring(2); // due decimali

    intera = intera.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    return sign + intera + "," + decimali + "%";
}

// -----------------------------
// CREA LA TABELLA
// -----------------------------
const tbody = document.querySelector("#tabella tbody");

for (let i = 0; i < 63; i++) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td>${settori[i]}</td>
        <td>${formatIT(domandaFinale[i])}</td>
        <td><input id="policy${i}" type="number" step="0.0001" value="0"></td>
        <td id="nuova${i}"></td>
        <td>${formatIT(produzione[i])}</td>
        <td id="ris${i}"></td>
        <td id="var${i}"></td>
    `;

    tbody.appendChild(tr);
}

// -----------------------------
// CARICA MATRICE
// -----------------------------
window.addEventListener("DOMContentLoaded", function() {

    fetch("ita_2022.txt")
        .then(r => r.text())
        .then(text => {

            const righe = text.trim().split(/\r?\n/);

            M = righe.map(riga =>
                riga
                    .trim()
                    .split(/\t+/)
                    .map(v => v.trim())
                    .filter(v => v !== "")
                    .map(v => parseFloat(v.replace(",", ".")))
            );

            for (let i = 0; i < 63; i++) {
                if (M[i].length !== 63 || M[i].some(isNaN)) {
                    console.error("Errore riga", i+1, M[i]);
                    alert("Errore nella matrice: riga " + (i+1) + " contiene valori non numerici.");
                    return;
                }
            }

            document.getElementById("status").textContent =
                "Matrice 63×63 caricata automaticamente ✔";
        })
        .catch(err => alert("Errore nel caricamento della matrice"));
});

// -----------------------------
// CALCOLO COMPLETO
// -----------------------------
function calcola() {
    if (!M) {
        alert("La matrice non è stata caricata.");
        return;
    }

    const nuova = [];
    for (let i = 0; i < 63; i++) {
        const pol = parseFloat(document.getElementById("policy"+i).value);
        const val = domandaFinale[i] + (isNaN(pol) ? 0 : pol);
        nuova.push(val);
        document.getElementById("nuova"+i).textContent = formatIT(val);
    }

    const risultato = new Array(63).fill(0);
    for (let i = 0; i < 63; i++) {
        let somma = 0;
        for (let j = 0; j < 63; j++) {
            somma += M[i][j] * nuova[j];
        }
        risultato[i] = somma;
        document.getElementById("ris"+i).textContent = formatIT(somma);
    }

    for (let i = 0; i < 63; i++) {
        const base = produzione[i];
        const nuovo = risultato[i];
        const perc = ((nuovo - base) / base) * 100;
        document.getElementById("var"+i).textContent = formatPerc(perc);
    }
}
</script>
